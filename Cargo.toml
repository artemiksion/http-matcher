[package]
name = "http-matcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
memchr = "2.8"
regex = "1.13"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

