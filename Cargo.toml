[package]
name = "http-matcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1

